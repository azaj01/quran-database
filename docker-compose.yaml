name: quran-database

services:
  mysql:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    environment:
      MYSQL_DATABASE: quran
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-quran}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test \"$$(mysql --protocol=socket --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --skip-column-names \"$${MYSQL_DATABASE}\" --execute='SELECT COUNT(*) FROM ayah_edition' 2>/dev/null)\" = 835624",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5m
    restart: "no"

  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: quran
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quran}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test \"$$(psql --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\" --tuples-only --no-align --command='SELECT COUNT(*) FROM ayah_edition' 2>/dev/null)\" = 835624",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5m
    restart: "no"

  sqlite:
    build:
      context: .
      dockerfile: docker/sqlite/Dockerfile
    volumes:
      - ${SQLITE_OUTPUT_DIR:-./output}:/output
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    restart: "no"

volumes:
  mysql-data:
  postgres-data:
